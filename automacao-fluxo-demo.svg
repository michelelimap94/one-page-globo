<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><rect width="1280" height="800" fill="#fff9f1"/><rect x="40" y="35" width="1200" height="730" rx="24" fill="#fff" stroke="#e6d4ed" stroke-width="2"/><text x="78" y="91" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#8b41db">PROJETO DE AUTOMAÇÃO · PYTHON + MYSQL</text><text x="78" y="145" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#28182d">Dos repasses mensais à consulta no banco</text><text x="78" y="183" font-family="Arial,sans-serif" font-size="19" fill="#77677d">Cenário ilustrativo: sete parceiras, um arquivo .ods por parceira e três abas por arquivo</text><rect x="78" y="226" width="336" height="192" rx="16" fill="#f4e7fa" stroke="#d9b9ea" stroke-width="2"/><text x="98" y="265" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#351947">01 · Arquivos recebidos</text><text x="98" y="303" font-family="Arial,sans-serif" font-size="17" fill="#66536c">Planilhas .ods todo mês</text><text x="98" y="331" font-family="Arial,sans-serif" font-size="17" fill="#66536c">3 abas, logos e regras</text><text x="98" y="359" font-family="Arial,sans-serif" font-size="17" fill="#66536c">Valores e percentuais de repasse</text><path d="M427 318h38m-13 -12 13 12-13 12" fill="none" stroke="#8b41db" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="480" y="226" width="336" height="192" rx="16" fill="#f4e7fa" stroke="#d9b9ea" stroke-width="2"/><text x="500" y="265" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#351947">02 · Automação Python</text><text x="500" y="303" font-family="Arial,sans-serif" font-size="17" fill="#66536c">Leitura e extração das abas</text><text x="500" y="331" font-family="Arial,sans-serif" font-size="17" fill="#66536c">Limpeza e conversão para CSV</text><text x="500" y="359" font-family="Arial,sans-serif" font-size="17" fill="#66536c">Colunas, nomes e IDs padronizados</text><path d="M829 318h38m-13 -12 13 12-13 12" fill="none" stroke="#8b41db" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="882" y="226" width="320" height="192" rx="16" fill="#f4e7fa" stroke="#d9b9ea" stroke-width="2"/><text x="902" y="265" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#351947">03 · Banco MySQL</text><text x="902" y="303" font-family="Arial,sans-serif" font-size="17" fill="#66536c">Validação e carga estruturada</text><text x="902" y="331" font-family="Arial,sans-serif" font-size="17" fill="#66536c">Parceira + brand_id + mês</text><text x="902" y="359" font-family="Arial,sans-serif" font-size="17" fill="#66536c">Dados prontos para consultas</text><rect x="78" y="462" width="1124" height="213" rx="18" fill="#351947"/><text x="110" y="512" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#fff">Antes: abrir planilha por planilha. Depois: consultar os períodos no banco.</text><text x="110" y="555" font-family="Arial,sans-serif" font-size="20" fill="#eedcf9">Exemplo de pergunta: qual o total de repasses da Parceira A entre janeiro e junho?</text><text x="110" y="599" font-family="Arial,sans-serif" font-size="20" fill="#eedcf9">Organização por competência, parceira e identificador, sem expor regras ou valores reais.</text><text x="110" y="642" font-family="Arial,sans-serif" font-size="18" fill="#d7b8e8">As regras específicas são tratadas conforme o layout de cada arquivo.</text><text x="78" y="735" font-family="Arial,sans-serif" font-size="17" fill="#796d7d">Demonstração conceitual com nomes, identificadores e valores fictícios. Sem dados internos.</text></svg>