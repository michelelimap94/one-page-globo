<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><rect width="1280" height="800" fill="#fff9f1"/><rect x="40" y="34" width="1200" height="730" rx="24" fill="#fff" stroke="#e7d6ef" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="76" y="88" font-size="19" font-weight="700" fill="#8b41db">PROJETO DE AUTOMAÇÃO · PYTHON + MYSQL</text><text x="76" y="143" font-size="35" font-weight="700" fill="#28182d">Dos repasses mensais à consulta no banco</text><text x="76" y="182" font-size="18" fill="#76677d">Fluxo do projeto: arquivos binários do Excel, tratamento automatizado e carga estruturada</text><rect x="76" y="227" width="345" height="217" rx="18" fill="#f3e7fa" stroke="#d7b2e8" stroke-width="2"/><text x="96" y="265" font-size="23" font-weight="700" fill="#351947">01 · Arquivos recebidos</text><text x="96" y="307" font-size="18" fill="#584660">Arquivos .xlsb de repasses</text><text x="96" y="338" font-size="18" fill="#584660">Aba DEMONSTRATIVO</text><text x="96" y="369" font-size="18" fill="#584660">Tabelas com cabeçalho variável</text><path d="M425 332h30m-11 -11 11 11-11 11" fill="none" stroke="#8b41db" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="467" y="227" width="345" height="217" rx="18" fill="#f3e7fa" stroke="#d7b2e8" stroke-width="2"/><text x="487" y="265" font-size="23" font-weight="700" fill="#351947">02 · Automação Python</text><text x="487" y="307" font-size="18" fill="#584660">Conversão .xlsb → .xlsx</text><text x="487" y="338" font-size="18" fill="#584660">Localização da tabela e limpeza</text><text x="487" y="369" font-size="18" fill="#584660">Padronização, datas e valores</text><path d="M816 332h30m-11 -11 11 11-11 11" fill="none" stroke="#8b41db" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="858" y="227" width="345" height="217" rx="18" fill="#f3e7fa" stroke="#d7b2e8" stroke-width="2"/><text x="878" y="265" font-size="23" font-weight="700" fill="#351947">03 · Banco MySQL</text><text x="878" y="307" font-size="18" fill="#584660">Validação dos registros</text><text x="878" y="338" font-size="18" fill="#584660">Inserção estruturada no banco</text><text x="878" y="369" font-size="18" fill="#584660">Informações prontas para consulta</text><rect x="76" y="477" width="1127" height="210" rx="17" fill="#351947"/><text x="103" y="524" font-size="25" font-weight="700" fill="#fff">Antes: análise manual em múltiplas planilhas.</text><text x="103" y="561" font-size="25" font-weight="700" fill="#fff">Depois: dados consolidados e disponíveis para consulta no banco.</text><text x="103" y="610" font-size="19" fill="#f2dffa">O script identifica o cabeçalho, descarta totais, seleciona os campos necessários,</text><text x="103" y="641" font-size="19" fill="#f2dffa">normaliza parceiros e colunas e trata datas e valores antes da carga.</text><text x="76" y="734" font-size="16" fill="#76677d">Representação didática. Sem arquivos, credenciais, valores ou regras internas da empresa.</text></g></svg>