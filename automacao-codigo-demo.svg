<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><rect width="1280" height="800" fill="#fff9f1"/><rect x="40" y="35" width="1200" height="730" rx="24" fill="#fff" stroke="#e6d4ed" stroke-width="2"/><text x="78" y="91" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#8b41db">PROJETO DE AUTOMAÇÃO · PYTHON + MYSQL</text><text x="78" y="145" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#28182d">Como a transformação funciona</text><text x="78" y="183" font-family="Arial,sans-serif" font-size="19" fill="#77677d">Pseudocódigo didático: ilustra etapas, não reproduz o código da empresa</text><rect x="78" y="214" width="1124" height="427" rx="18" fill="#251c31"/><text x="113" y="255" font-family="Consolas,monospace" font-size="21" fill="#f0e6f6">import pandas as pd</text><text x="113" y="287" font-family="Consolas,monospace" font-size="21" fill="#f0e6f6">from pathlib import Path</text><text x="113" y="319" font-family="Consolas,monospace" font-size="21" fill="#f0e6f6"></text><text x="113" y="351" font-family="Consolas,monospace" font-size="21" fill="#f0e6f6">for arquivo in Path("entrada").glob("*.ods"):</text><text x="113" y="383" font-family="Consolas,monospace" font-size="21" fill="#f0e6f6">    abas = pd.read_excel(arquivo, sheet_name=None, engine="odf")</text><text x="113" y="415" font-family="Consolas,monospace" font-size="21" fill="#f0e6f6">    for nome_aba, tabela in abas.items():</text><text x="113" y="447" font-family="Consolas,monospace" font-size="21" fill="#f0e6f6">        dados = selecionar_colunas(tabela)  # layout fictício</text><text x="113" y="479" font-family="Consolas,monospace" font-size="21" fill="#f0e6f6">        dados = padronizar(dados, arquivo.stem, nome_aba)</text><text x="113" y="511" font-family="Consolas,monospace" font-size="21" fill="#f0e6f6">        dados = validar(dados).drop_duplicates()</text><text x="113" y="543" font-family="Consolas,monospace" font-size="21" fill="#f0e6f6">        dados.to_csv("saida/tratado.csv", index=False)</text><text x="113" y="575" font-family="Consolas,monospace" font-size="21" fill="#f0e6f6">        carregar_mysql(dados)  # conexão segura e configurada à parte</text><rect x="78" y="654" width="1124" height="44" rx="10" fill="#f3e5f9"/><text x="98" y="683" font-family="Arial,sans-serif" font-size="17" fill="#51325e">Remoção de elementos visuais, seleção de campos, padronização de brand_id e validação antecedem a carga.</text><text x="78" y="735" font-family="Arial,sans-serif" font-size="17" fill="#796d7d">Demonstração conceitual com nomes, identificadores e valores fictícios. Sem dados internos.</text></svg>