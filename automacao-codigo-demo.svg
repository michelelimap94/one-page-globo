<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><rect width="1280" height="800" fill="#fff9f1"/><rect x="40" y="34" width="1200" height="730" rx="24" fill="#fff" stroke="#e7d6ef" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="76" y="88" font-size="19" font-weight="700" fill="#8b41db">PROJETO DE AUTOMAÇÃO · PYTHON + MYSQL</text><text x="76" y="143" font-size="35" font-weight="700" fill="#28182d">Como a automação funciona na prática</text><text x="76" y="182" font-size="18" fill="#76677d">Pseudocódigo inspirado nas etapas do script original — não é código executável</text><rect x="76" y="216" width="1127" height="440" rx="17" fill="#251c31"/><text x="110" y="255" font-family="Consolas,monospace" font-size="22" fill="#f4eafa">from pathlib import Path</text><text x="110" y="286" font-family="Consolas,monospace" font-size="22" fill="#f4eafa">import pandas as pd</text><text x="110" y="317" font-family="Consolas,monospace" font-size="22" fill="#f4eafa"></text><text x="110" y="348" font-family="Consolas,monospace" font-size="22" fill="#d8a9ff">for arquivo in Path("entrada").glob("*.xlsb"):</text><text x="110" y="379" font-family="Consolas,monospace" font-size="22" fill="#f4eafa">    planilha = converter_para_xlsx(arquivo)</text><text x="110" y="410" font-family="Consolas,monospace" font-size="22" fill="#f4eafa">    aba = localizar_aba(planilha, "DEMONSTRATIVO")</text><text x="110" y="441" font-family="Consolas,monospace" font-size="22" fill="#f4eafa">    cabecalho = identificar_cabecalho(aba)</text><text x="110" y="472" font-family="Consolas,monospace" font-size="22" fill="#f4eafa">    dados = extrair_tabela(aba, cabecalho, ate="TOTAL")</text><text x="110" y="503" font-family="Consolas,monospace" font-size="22" fill="#f4eafa">    dados = padronizar_parceiros_e_colunas(dados)</text><text x="110" y="534" font-family="Consolas,monospace" font-size="22" fill="#f4eafa">    dados = tratar_datas_e_valores(dados)</text><text x="110" y="565" font-family="Consolas,monospace" font-size="22" fill="#f4eafa">    dados = validar_registros(dados)</text><text x="110" y="596" font-family="Consolas,monospace" font-size="22" fill="#f4eafa">    inserir_no_mysql(dados)</text><rect x="76" y="669" width="1127" height="36" rx="9" fill="#f1e1f9"/><text x="93" y="693" font-size="16" fill="#50305f">Conversão → cabeçalho → limpeza → mapeamento → tratamento → validação → carga MySQL</text><text x="76" y="734" font-size="16" fill="#76677d">Representação didática. Sem arquivos, credenciais, valores ou regras internas da empresa.</text></g></svg>