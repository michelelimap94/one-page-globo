<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><rect width="1280" height="800" fill="#fff9f1"/><rect x="48" y="44" width="1184" height="712" rx="24" fill="#fff" stroke="#e8d7ec" stroke-width="2"/><text x="90" y="102" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#8b41db">PYTHON · EXEMPLO DIDÁTICO</text><text x="90" y="157" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#28182d">Tratamento e carga dos dados</text><text x="90" y="195" font-family="Arial,sans-serif" font-size="19" fill="#76697a">Trecho ilustrativo — não é o código original da Vivo</text><rect x="90" y="233" width="1100" height="424" rx="18" fill="#251c31"/><g font-family="Consolas,monospace" font-size="25" fill="#f2eaf7"><text x="132" y="288"><tspan fill="#cba6f7">import</tspan> pandas <tspan fill="#cba6f7">as</tspan> pd</text><text x="132" y="336"><tspan fill="#cba6f7">from</tspan> sqlalchemy <tspan fill="#cba6f7">import</tspan> create_engine</text><text x="132" y="408">df = pd.read_excel(<tspan fill="#f7c88b">"dados_exemplo.xlsx"</tspan>)</text><text x="132" y="456">df.columns = df.columns.str.strip().str.lower()</text><text x="132" y="504">df = df.dropna().drop_duplicates()</text><text x="132" y="552">engine = create_engine(<tspan fill="#f7c88b">"mysql+pymysql://..."</tspan>)</text><text x="132" y="600">df.to_sql(<tspan fill="#f7c88b">"tabela_demo"</tspan>, engine, if_exists=<tspan fill="#f7c88b">"append"</tspan>, index=<tspan fill="#cba6f7">False</tspan>)</text></g><text x="90" y="709" font-family="Arial,sans-serif" font-size="19" fill="#55435c">Fluxo real representado em alto nível: leitura → limpeza → padronização → carga no MySQL.</text></svg>